databases:
  - name: nivor-free-db
    databaseName: nivor
    user: nivor_app
    plan: free
    region: singapore

services:
  - type: web
    name: nivor-free-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./nivor-backend/Dockerfile
    dockerContext: ./nivor-backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: nivor-free-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nivor-free-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nivor-free-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nivor-free-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nivor-free-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: FRONTEND_URL
        value: https://nivor-iota.vercel.app
      - key: FILE_STORAGE_PROVIDER
        value: local
      - key: FILE_STORAGE_LOCAL_PATH
        value: /tmp/nivor-uploads
      - key: AI_PROVIDER
        value: ""
